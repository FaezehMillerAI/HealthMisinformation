experiment_name: smoke
seed: 42
output_dir: outputs/smoke

data:
  dataset_name: amanrangapur/Fin-Fact
  test_size: 0.2
  max_train_samples: 64
  max_val_samples: 16

feature_flags:
  use_digest: true
  use_rationale: true
  use_context: true

rationale:
  encoder_name: sentence-transformers/all-MiniLM-L6-v2
  top_k: 2
  evidence_weight: 0.7
  claim_weight: 0.3

counterfactuals:
  enabled: true
  max_per_example: 1

classifier:
  max_features: 2000
  ngram_max: 2
  c: 2.0
  max_iter: 1000

explanations:
  max_rationale_sentences: 2

smoke:
  train_samples: 48
  val_samples: 12
