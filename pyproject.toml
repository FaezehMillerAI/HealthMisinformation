[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finfact-cgse"
version = "0.1.0"
description = "Counterfactually-Grounded Structured Explanations for financial misinformation detection on Fin-Fact."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=4.5.0",
  "joblib>=1.5.0",
  "numpy>=2.0.0",
  "pandas>=2.3.0",
  "PyYAML>=6.0.0",
  "scikit-learn>=1.6.0",
  "sentence-transformers>=5.1.0",
  "torch>=2.0.0",
  "tqdm>=4.67.0",
  "transformers>=4.57.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
